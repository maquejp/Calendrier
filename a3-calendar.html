<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendrier A3 - 3 mois par page</title>
    <link rel="stylesheet" href="a3-calendar.css" />
  </head>
  <body>
    <div class="controls">
      <label for="yearInput">Année</label>
      <input id="yearInput" type="number" min="1900" max="2100" step="1" />
      <label for="yearsInput">Nombre d'années</label>
      <input id="yearsInput" type="number" min="1" max="20" step="1" />
      <label for="modeInput">Mode</label>
      <select id="modeInput">
        <option value="glissant" selected>
          3 mois glissants (fév-mar-avr ... nov-déc-jan)
        </option>
        <option value="trimestre">
          Trimestres fixes (jan-fev-mar, avr-mai-juin...)
        </option>
      </select>
      <button id="buildBtn" type="button">Générer calendrier</button>
      <button id="printBtn" type="button">Imprimer / Exporter PDF</button>
    </div>

    <aside class="infoBox" aria-live="polite">
      <p class="infoBoxTitle">
        Pour un résultat parfait dans la fenêtre d'impression :
      </p>
      <ul>
        <li>Format papier : A3</li>
        <li>Orientation : Portrait</li>
        <li>Échelle : 100% (pas "Ajuster à la page")</li>
      </ul>
    </aside>

    <main id="calendarRoot" aria-live="polite"></main>

    <script src="a3-calendar.js"></script>
  </body>
</html>
